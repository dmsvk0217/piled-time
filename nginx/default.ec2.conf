server {
    listen 80;
    server_name piled-time.com www.piled-time.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.piled-time.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name piled-time.com www.piled-time.com;

    ssl_certificate /etc/letsencrypt/live/piled-time.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piled-time.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            set $cors "false";

            if ($http_origin = "https://piled-time.com") {
                set $cors "true";
            }

            if ($http_origin = "https://www.piled-time.com") {
                set $cors "true";
            }

            if ($cors = "true") {
                add_header 'Access-Control-Allow-Origin' "$http_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }
        }

        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}


