# 비-SSL www 도메인 → non-www 리디렉션
server {
    listen 80;
    server_name www.piled-time.com;
    return 301 https://piled-time.com$request_uri;
}

# 비-SSL 일반 도메인 → https로 리디렉션
server {
    listen 80;
    server_name piled-time.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://piled-time.com$request_uri;
    }
}

# SSL www 도메인 → https://piled-time.com으로 리디렉션
server {
    listen 443 ssl;
    server_name www.piled-time.com;

    ssl_certificate     /etc/letsencrypt/live/piled-time.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piled-time.com/privkey.pem;

    return 301 https://piled-time.com$request_uri;
}

# ✅ 메인 서버: https://piled-time.com
server {
    listen 443 ssl;
    server_name piled-time.com;

    ssl_certificate     /etc/letsencrypt/live/piled-time.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piled-time.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA 라우팅 처리
    location / {
        try_files $uri /index.html;
    }

    # CORS + API proxy
    location /api/ {
        # OPTIONS 프리플라이트 요청
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "https://piled-time.com" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            return 204;
        }

        # 실제 요청에 CORS 헤더 추가
        add_header 'Access-Control-Allow-Origin' "https://piled-time.com" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
