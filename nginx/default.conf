# nginx.conf 또는 server 블록 위에 위치
# http 블록 안에 위치해야 함 (nginx.conf에서 직접 쓰는 경우는 http 블록 안에 넣으세요)
http{
    map $http_origin $cors_origin {
        default "";
        "https://piled-time.com"        "https://piled-time.com";
        "https://www.piled-time.com"    "https://www.piled-time.com";
    }

    server {
        listen 80;
        server_name piled-time.com www.piled-time.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.piled-time.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name piled-time.com www.piled-time.com;

        ssl_certificate     /etc/letsencrypt/live/piled-time.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/piled-time.com/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # OPTIONS 프리플라이트 요청 처리
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                return 204;
            }

            # 실제 요청에 대한 CORS 헤더
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://server:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}