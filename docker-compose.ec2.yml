services:
  nginx:
    image: yourdockerhub/react-nginx-app:latest
    container_name: nginx_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - server

  server:
    image: yourdockerhub/nest-server:latest
    container_name: nest_api
    restart: always
    expose:
      - "4000"
    env_file:
      - ./server/.env.production
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - ./server/.env.production
    volumes:
      - mysql_data:/var/lib/mysql

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${CERTBOT_DOMAIN1} -d ${CERTBOT_DOMAIN2}"

volumes:
  mysql_data:
