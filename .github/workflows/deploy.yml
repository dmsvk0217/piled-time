name: Build and Push Docker Images, EC2 Deploy

on:
  push:
    branches: [main]

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      # ✅ Build & Push React + Nginx (context: .)
      - name: Build and Push React-Nginx image
        run: |
          docker build \
            -f client/Dockerfile.nginx-react \
            --build-arg BUILD_SCRIPT=build:production \
            -t $DOCKER_USER/react-nginx-app \
            .
          docker push $DOCKER_USER/react-nginx-app

      # ✅ Build & Push NestJS (context: ./server)
      - name: Build and Push NestJS image
        run: |
          docker build \
            --build-arg START_SCRIPT=start:production \
            -t $DOCKER_USER/nest-server \
            ./server
          docker push $DOCKER_USER/nest-server

      # ✅ Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/piled-time
            docker pull $DOCKER_USER/react-nginx-app
            docker pull $DOCKER_USER/nest-server
            docker compose -f docker-compose.ec2.yml down
            docker compose -f docker-compose.ec2.yml up -d
